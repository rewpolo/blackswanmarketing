# The name must match the Worker's name in your Cloudflare dashboard.
name = "black-swan-marketing"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "black-swan-leads"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
