# The name must match the Worker's name in your Cloudflare dashboard.
name = "blackswanmarketing"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "black-swan-leads"
database_id = "04c7fd4a-df28-4a93-9a9a-d11316d9cbf3"

# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
# ...
